<!--
  DIRECTION CONTRACT
  THESIS: iOS 26 "Liquid Glass" — floating frosted-glass panels that let the
    live photo behind them refract through, replacing the flat bordered-list
    dark theme this dashboard shipped with before.
  OWN-WORLD: translucent blurred panels (blur+saturate, inset specular
    hairline, offset depth shadow, radial sheen), pill controls and badges,
    Apple system semantic colors (systemGreen/Red/Blue/Orange) on a
    -apple-system/SF type stack, status conveyed by a glowing dot, never a
    colored left border.
  STORY: the owner glances at one screen and instantly reads which of their
    apps/containers/VMs are alive, and can start/stop/restart any of them
    in one tap, from desktop or phone.
  FIRST VIEWPORT: wallpaper fills the frame; header title floats directly on
    it under a soft top scrim; below it, four stacked glass panels (Tailscale,
    Veda Apps, Docker, VMware), each a grouped list of glass rows.
  FORM: brief-pinned world (user named "iOS Liquid Glass" explicitly) — no
    concept tournament run; direction committed straight from the brief per
    the skill's "brief wins / pinned direction beats the roll" rule.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the
    finish review, the verdict, and DESIGN.md.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veda Dashboard</title>
  <!-- Google Fonts (fallback for non-Apple devices) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Type */
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", system-ui, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Fira Code", monospace;

      /* Labels — iOS translucent label vocabulary over glass */
      --label-primary:    rgba(255,255,255,0.97);
      --label-secondary:  rgba(255,255,255,0.78);
      --label-tertiary:   rgba(255,255,255,0.72);
      --label-quaternary: rgba(255,255,255,0.32);

      /* Apple system semantic colors (dark-mode variants) */
      --sys-blue:    #0A84FF;
      --sys-green:   #30D158;
      --sys-red:     #FF453A;
      --sys-orange:  #FF9F0A;
      --sys-yellow:  #FFD60A;
      --sys-teal:    #40C8E0;
      --sys-indigo:  #6A5CE6;
      --sys-gray:    #98989F;

      /* Glass material */
      --glass-fill:      linear-gradient(165deg, rgba(36,53,72,0.86), rgba(12,24,39,0.84) 45%, rgba(18,32,49,0.88));
      --glass-fill-hi:   linear-gradient(165deg, rgba(255,255,255,0.22), rgba(255,255,255,0.08) 45%, rgba(255,255,255,0.12));
      --glass-border:    rgba(255,255,255,0.20);
      --glass-hairline:  rgba(255,255,255,0.10);
      --glass-blur:      28px;
      --glass-blur-btn:  10px;
      --radius-panel:    20px;
      --radius-row:      14px;
      --radius-pill:     999px;
      --name-col:        250px;

      --shadow-panel: 0 24px 48px -16px rgba(0,0,0,0.55), 0 2px 10px rgba(0,0,0,0.30);
      --shadow-float: 0 10px 28px -8px rgba(0,0,0,0.5), 0 1px 4px rgba(0,0,0,0.3);
    }

*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; }
    html { overflow-x: hidden; background: #0a141f; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: var(--font-sans);
      color: var(--label-primary);
      text-shadow: 0 1px 1px rgba(0,0,0,0.25);
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
    }

    /* Fixed wallpaper + legibility scrim.  Use the largest mobile viewport
       unit so Chrome's collapsing URL bar reveals more wallpaper instead of
       resizing its cover crop and making the image jump. */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      height: 100lvh;
      z-index: -2;
      background: url('/static/wallpaper.jpg') center 30% / cover no-repeat;
    }
    body::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(180deg, rgba(4,10,20,0.5) 0px, rgba(4,10,20,0.18) 180px, transparent 340px);
    }

    .wrap { max-width: 840px; margin: 0 auto; padding: 0 20px 40px; }

    /* ---------- Header ---------- */
    header.top {
      padding: 18px 4px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header.top h1 {
      margin: 0;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--label-primary);
      text-shadow: 0 1px 8px rgba(0,0,0,0.35);
    }
    .icon-btn {
      width: 32px; height: 32px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--glass-border);
      background: var(--glass-fill);
      backdrop-filter: blur(var(--glass-blur-btn)) saturate(180%);
      -webkit-backdrop-filter: blur(var(--glass-blur-btn)) saturate(180%);
      box-shadow: var(--shadow-float), 0 1px 0 rgba(255,255,255,0.16) inset;
      color: var(--label-primary);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: transform 150ms cubic-bezier(.2,.8,.2,1), background 150ms ease, border-color 150ms ease;
    }
    .icon-btn svg { filter: drop-shadow(0 1px 1.5px rgba(0,0,0,0.4)); }
    .icon-btn:hover { border-color: rgba(255,255,255,0.32); }
    .icon-btn:active { transform: scale(0.92); }
    .icon-btn.danger:hover { color: var(--sys-red); border-color: rgba(255,69,58,0.5); }
    .icon-btn:focus-visible, .btn-pill:focus-visible, .chip-x:focus-visible {
      outline: none; box-shadow: 0 0 0 3px rgba(10,132,255,0.55), var(--shadow-float);
    }
    .header-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .secondary-nav { display:flex; align-items:center; gap:10px; margin-inline-start:auto; margin-inline-end:4px; }
    .secondary-nav a { color:var(--label-secondary); font-size:11px; text-decoration:underline; text-underline-offset:3px; }
    .secondary-nav a:hover { color:var(--label-primary); }
    .secondary-nav a:focus-visible, .action-state a:focus-visible { outline:2px solid var(--sys-blue); outline-offset:3px; border-radius:4px; }
    .control-notice { color:#ffd39b; font-size:11px; max-width:240px; overflow-wrap:anywhere; }
    .icon-btn.is-active { background: rgba(10,132,255,0.28); border-color: rgba(10,132,255,0.55); color: #cfe6ff; }
    .icon-btn { flex-shrink: 0; }

    /* ---------- Glass panel (section) ---------- */
    .panel {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-panel);
      background: linear-gradient(165deg, rgba(36,53,72,0.36), rgba(12,24,39,0.30) 45%, rgba(18,32,49,0.38));
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(var(--glass-blur)) saturate(180%);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
      box-shadow: var(--shadow-panel), 0 1px 0 rgba(255,255,255,0.18) inset, 0 -1px 0 rgba(0,0,0,0.14) inset;
      margin-bottom: 12px;
      opacity: 0;
      transform: translateY(10px) scale(0.99);
      filter: blur(6px);
      animation: materialize 480ms cubic-bezier(.2,.7,.2,1) forwards;
    }
    .panel::before {
      content: "";
      position: absolute; inset: 0;
      background: radial-gradient(560px 320px at 12% -12%, rgba(255,255,255,0.12), transparent 55%);
      mix-blend-mode: overlay;
      pointer-events: none;
    }
    @keyframes materialize {
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .panel { animation: none; opacity: 1; transform: none; filter: none; }
    }

    .panel-head {
      position: relative;
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
      padding: 10px 14px 8px;
    }
    .panel-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .section-icon {
      width: 22px; height: 22px; flex-shrink: 0;
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 1px 0 rgba(255,255,255,0.25) inset, 0 3px 6px -1px rgba(0,0,0,0.35);
    }
    .section-icon svg { width: 13px; height: 13px; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,0.4)); }
    .icon-wifi svg { filter: drop-shadow(0 2px 4px rgba(0,0,0,0.7)); }
    .panel-title h2 {
      margin: 0;
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.07em; text-transform: uppercase;
      color: var(--label-secondary);
    }
    .panel-title .badge-count {
      font-size: 10px; font-weight: 600; color: var(--label-tertiary);
      margin-left: 6px;
    }

    .seg { display: flex; gap: 2px; flex-shrink: 0; background: rgba(255,255,255,0.08); padding: 2px; border-radius: var(--radius-pill); border: 1px solid var(--glass-border); }
    .seg button {
      font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
      background: none; border: none; padding: 4px 10px; border-radius: var(--radius-pill);
      color: var(--label-tertiary); cursor: pointer; transition: all 150ms ease;
      text-shadow: 0 1px 2px rgba(0,0,0,0.35);
    }
    .seg button.active { background: rgba(255,255,255,0.20); color: var(--label-primary); box-shadow: 0 2px 5px -1px rgba(0,0,0,0.30); }

    .chip-btn {
      font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
      color: var(--label-secondary); background: rgba(255,255,255,0.08);
      border: 1px solid var(--glass-border); border-radius: var(--radius-pill);
      padding: 4px 11px; cursor: pointer; transition: all 150ms ease;
    }
    .chip-btn:hover { background: rgba(255,255,255,0.16); color: var(--label-primary); }

    /* ---------- Rows ---------- */
    .rows { position: relative; }
    .row {
      padding: 6px 14px;
      border-top: 1px solid var(--glass-hairline);
      transition: background-color 150ms ease;
    }
    .rows > .row:first-child { border-top: none; }
    .row:hover { background: rgba(255,255,255,0.05); }

    /* One compact line: name + status, actions, disclosure. */
    .row-main { display: flex; align-items: center; gap: 10px; min-height: 30px; }

    /* Description / command / ports / health live here - hidden until the row
       is expanded, or until the header "Details" toggle turns them all on. */
    .row-detail { display: none; padding: 0 0 6px 16px; }
    .row.expanded > .row-detail,
    body.details-on .row-detail { display: block; }

    .disclosure {
      flex-shrink: 0; width: 22px; height: 22px; padding: 0;
      display: flex; align-items: center; justify-content: center;
      border: none; background: none; cursor: pointer;
      color: var(--label-quaternary);
      border-radius: var(--radius-pill);
      transition: color 150ms ease, transform 180ms cubic-bezier(.2,.8,.2,1), background 150ms ease;
    }
    /* Rows with nothing to disclose still reserve the slot, so the pills and
       controls of every row share one right edge. */
    .disclosure-spacer { flex-shrink: 0; width: 22px; }
    .disclosure:hover { color: var(--label-secondary); background: rgba(255,255,255,0.10); }
    .disclosure:focus-visible { outline: none; box-shadow: 0 0 0 2px rgba(10,132,255,0.55); }
    .row.expanded > .row-main > .disclosure,
    body.details-on .disclosure { transform: rotate(90deg); color: var(--label-secondary); }

    /* Grouped app card — one app name, independent frontend/backend sub-rows */
    .app-group { border-top: 1px solid var(--glass-hairline); padding-bottom: 2px; }
    .rows > .app-group:first-child { border-top: none; }
    .app-group-head {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px 0;
      font-size: 13px; font-weight: 700; color: var(--label-primary);
    }
    .app-group-sub { border-top: none; }
    .app-group-sub .lead-line { padding-left: 24px; }
    .app-group-sub .name-text { font-size: 11px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: var(--label-secondary); }

    .row-content { flex: 0 0 var(--name-col); min-width: 0; padding-right: 2px; }
    .lead-line { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
      background: var(--sys-gray);
      box-shadow: none;
    }
    .status-dot.is-on {
      background: var(--sys-green);
    }
    .name-text {
      font-size: 13.5px; font-weight: 600; color: var(--label-primary);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      min-width: 0; flex-shrink: 1;
    }
    a.name-text {
      color: var(--label-primary); text-decoration: none;
      display: inline-flex; align-items: center; gap: 5px;
      transition: color 150ms ease;
    }
    a.name-text:hover { color: var(--sys-blue); text-decoration: underline; text-underline-offset: 2px; }
    a.name-text:focus-visible { outline: none; color: var(--sys-blue); text-decoration: underline; }
    a.name-text svg { flex-shrink: 0; opacity: 0.5; transition: opacity 150ms ease; }
    a.name-text:hover svg { opacity: 1; }

    .pill-badge {
      margin-left: 8px; flex-shrink: 0;
      font-size: 9.5px; font-weight: 700; letter-spacing: 0.02em;
      padding: 2px 8px; border-radius: var(--radius-pill);
      border: 1px solid transparent;
    }
    .pill-badge.on  { color: var(--sys-green); background: rgba(48,209,88,0.16); border-color: rgba(48,209,88,0.32); }
    .pill-badge.off { color: var(--label-tertiary); background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }

    .desc-line {
      font-size: 11.5px; color: var(--label-secondary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-top: 2px; line-height: 1.35;
    }
    .mono-line {
      font-size: 10px; font-family: var(--font-mono); color: var(--label-tertiary);
      letter-spacing: 0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-top: 2px;
    }
    .mono-line.accent { color: var(--sys-teal); }
    .health-line.online { color: var(--sys-green); }
    .health-line.offline { color: var(--sys-red); }
    .health-line.waiting { color: var(--label-tertiary); }

    .row-actions {
      display: flex; flex-direction: row; flex-wrap: nowrap; gap: 5px;
      flex-shrink: 0; margin-left: auto;
      justify-content: flex-end; align-items: center;
    }
    .codex-control { display: inline-flex; flex-shrink: 0; isolation: isolate; }
    .codex-control .btn-pill { border-radius: 0; }
    .codex-control .btn-pill + .btn-pill { margin-left: -1px; }
    .codex-control .btn-pill:first-child { border-radius: var(--radius-pill) 0 0 var(--radius-pill); }
    .codex-control .btn-pill:last-child { border-radius: 0 var(--radius-pill) var(--radius-pill) 0; }
    .codex-control .btn-pill:focus-visible { position: relative; z-index: 1; }

    /* Dev / Docker run-mode switch, shown only for apps that have both. */
    .mode-seg {
      display: flex; gap: 2px; flex-shrink: 0;
      background: rgba(255,255,255,0.08); padding: 2px;
      border-radius: var(--radius-pill); border: 1px solid var(--glass-border);
    }
    .mode-seg button {
      font-size: 9.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
      background: none; border: none; padding: 3px 9px; border-radius: var(--radius-pill);
      color: var(--label-tertiary); cursor: pointer; transition: all 150ms ease;
      text-shadow: 0 1px 2px rgba(0,0,0,0.35);
    }
    .mode-seg button:hover:not(.active) { color: var(--label-primary); }
    .mode-seg button.active { background: rgba(255,255,255,0.20); color: var(--label-primary); cursor: default; }
    .mode-seg button.active.docker { background: rgba(10,132,255,0.32); color: #cfe6ff; }
    .mode-seg button:disabled:not(.active) { opacity: 0.4; cursor: not-allowed; }

    .empty-row { padding: 16px 14px; font-size: 12px; color: var(--label-tertiary); }

    /* ---------- Pill buttons ---------- */
    .btn-pill {
      width: auto; height: 25px; padding: 0 11px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.08);
      color: var(--label-secondary);
      font-family: var(--font-sans); font-size: 10.5px; font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer; white-space: nowrap;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 5px -1px rgba(0,0,0,0.30);
      text-shadow: 0 1px 2px rgba(0,0,0,0.35);
      transition: transform 120ms cubic-bezier(.2,.8,.2,1), background 150ms ease, border-color 150ms ease, color 150ms ease, opacity 150ms ease, box-shadow 150ms ease;
    }
    .btn-pill svg { filter: drop-shadow(0 1px 1.5px rgba(0,0,0,0.4)); }
    .btn-pill:active:not(:disabled) { transform: scale(0.94); box-shadow: 0 1px 2px -1px rgba(0,0,0,0.25); }
    .btn-pill:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }
    .btn-pill.tone-start:hover:not(:disabled)   { background: rgba(48,209,88,0.18);  border-color: rgba(48,209,88,0.45);  color: var(--sys-green); }
    .btn-pill.tone-stop:hover:not(:disabled)    { background: rgba(255,69,58,0.18);  border-color: rgba(255,69,58,0.45);  color: var(--sys-red); }
    .btn-pill.tone-restart:hover:not(:disabled) { background: rgba(255,159,10,0.18); border-color: rgba(255,159,10,0.45); color: var(--sys-orange); }
    .btn-pill.tone-shell:hover:not(:disabled)   { background: rgba(10,132,255,0.18); border-color: rgba(10,132,255,0.45); color: var(--sys-blue); }
    .btn-pill.pending {
      opacity: 0.7; cursor: not-allowed;
      background: rgba(255,159,10,0.16); border-color: rgba(255,159,10,0.4); color: var(--sys-orange);
    }
    .spinner { animation: spin 0.7s linear infinite; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- Skeletons ---------- */
    @keyframes skPulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.15; } }
    .sk { background: rgba(255,255,255,0.22); border-radius: 5px; animation: skPulse 1.5s ease-in-out infinite; flex-shrink: 0; }

    /* ---------- Config tab ---------- */
    .cfg-row { padding: 9px 14px; border-top: 1px solid var(--glass-hairline); }
    .rows > .cfg-row:first-child { border-top: none; }
    .cfg-name { font-size: 13.5px; font-weight: 600; color: var(--label-primary); margin-bottom: 4px; }
    .cfg-field { display: flex; gap: 10px; align-items: baseline; min-width: 0; margin-top: 2px; }
    .cfg-field .k {
      font-size: 9.5px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
      color: var(--label-tertiary); flex-shrink: 0; width: 46px;
    }
    .cfg-field .v {
      font-size: 11px; font-family: var(--font-mono); letter-spacing: 0.01em;
      color: var(--label-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .cfg-field .v.accent { color: var(--sys-teal); }

    /* ---------- Toasts (HUD, top-center) ---------- */
    #toasts {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 8px;
      pointer-events: none;
    }
    .toast {
      background: var(--glass-fill-hi);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(var(--glass-blur)) saturate(180%);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
      border-radius: var(--radius-pill);
      padding: 10px 20px;
      box-shadow: var(--shadow-float), 0 1px 0 rgba(255,255,255,0.2) inset;
      font-size: 13px; font-weight: 500; line-height: 1.3;
      max-width: min(88vw, 360px);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      animation: toastIn 260ms cubic-bezier(.2,.8,.2,1);
    }
    .toast.err { color: #ffb4ae; }
    .toast.ok  { color: var(--label-primary); }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-8px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }

    /* ---------- Modal ---------- */
    #dockerModal {
      position: fixed; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center;
      background: rgba(2,6,14,0.55);
      backdrop-filter: blur(6px);
      animation: backdropIn 200ms ease-out;
    }
    #dockerModal.hidden { display: none; }
    @keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-card {
      width: 100%; max-width: 420px; margin: 0 16px; padding: 26px;
      border-radius: 28px;
      background: var(--glass-fill-hi);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(var(--glass-blur)) saturate(180%);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
      box-shadow: var(--shadow-panel), 0 1px 0 rgba(255,255,255,0.2) inset;
      animation: panelIn 220ms cubic-bezier(.2,.8,.2,1);
    }
    @keyframes panelIn { from { opacity: 0; transform: translateY(10px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .modal-card h3 { margin: 0 0 6px; font-size: 16px; font-weight: 700; color: var(--label-primary); }
    .modal-card p { margin: 0 0 18px; font-size: 12.5px; color: var(--label-secondary); line-height: 1.5; }
    .chip-wrap { display: flex; flex-wrap: wrap; gap: 7px; min-height: 30px; margin-bottom: 14px; }
    .chip {
      display: inline-flex; align-items: center; gap: 7px;
      background: rgba(255,255,255,0.10); border: 1px solid var(--glass-border);
      border-radius: var(--radius-pill); padding: 4px 6px 4px 12px;
      font-size: 12px; color: var(--label-secondary);
    }
    .chip-x {
      background: rgba(255,255,255,0.14); border: none; color: var(--label-secondary);
      cursor: pointer; line-height: 1; font-size: 10px; padding: 0;
      width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      transition: all 150ms ease;
    }
    .chip-x:hover { background: rgba(255,69,58,0.5); color: #fff; }
    .chip-empty { font-size: 11.5px; color: var(--label-tertiary); font-style: italic; }
    .modal-input {
      flex: 1; background: rgba(0,0,0,0.22); border: 1px solid var(--glass-border);
      border-radius: var(--radius-pill); padding: 10px 16px; font-size: 13px;
      color: var(--label-primary); outline: none; font-family: var(--font-sans);
      transition: border-color 150ms ease;
    }
    .modal-input::placeholder { color: var(--label-tertiary); }
    .modal-input:focus { border-color: rgba(10,132,255,0.6); }
    .modal-row-input { display: flex; gap: 8px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
    .btn-modal {
      padding: 9px 18px; font-size: 12px; font-weight: 700; letter-spacing: 0.02em;
      border-radius: var(--radius-pill); cursor: pointer; transition: all 150ms ease;
      border: 1px solid var(--glass-border); background: rgba(255,255,255,0.08); color: var(--label-secondary);
    }
    .btn-modal:hover { color: var(--label-primary); background: rgba(255,255,255,0.14); }
    .btn-modal.primary { background: rgba(10,132,255,0.24); border-color: rgba(10,132,255,0.5); color: #cfe6ff; }
    .btn-modal.primary:hover { background: rgba(10,132,255,0.36); }
    .btn-modal:active { transform: scale(0.96); }
    .auth-gate { position:fixed; inset:0; z-index:1000; display:grid; place-items:center; padding:20px; background:rgba(2,8,17,.74); backdrop-filter:blur(22px); }
    .auth-card { width:min(380px,100%); padding:24px; border:1px solid var(--glass-border); border-radius:var(--radius-panel); background:var(--glass-fill); box-shadow:var(--shadow-panel); }
    .auth-card h2 { margin:0 0 6px; font-size:22px; }.auth-card p { color:var(--label-secondary); margin:0 0 18px; font-size:13px; }
    .auth-card .modal-input { width:100%; margin:5px 0; }.auth-card .btn-modal { width:100%; margin-top:12px; }
    .login-error { margin:10px 0 2px; padding:9px 12px; border-radius:12px; background:rgba(255,69,58,.14); color:#ffd4d1; font-size:12px; line-height:1.4; overflow-wrap:anywhere; }
    .action-state { display:flex; align-items:center; gap:8px; margin:0 12px 8px 30px; min-height:28px; color:var(--label-secondary); font-size:11px; animation:action-reveal 180ms cubic-bezier(.22,1,.36,1); }
    .action-summary { display:flex; align-items:center; gap:8px; min-width:0; flex:1 1 auto; }
    .action-state strong { color:var(--label-primary); font-size:11px; }.action-state .action-message { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .action-state a { margin-inline-start:auto; min-height:28px; display:inline-flex; align-items:center; color:#9dcbff; font-weight:650; text-decoration:underline; text-underline-offset:3px; white-space:nowrap; }
    .action-state.failed strong { color:#ffd4d1; }.action-state.done strong { color:#baf3c8; }.action-state.pending strong,.action-state.running strong { color:#ffd39b; }
    @keyframes action-reveal { from { opacity:.35; transform:translateY(-3px); } to { opacity:1; transform:none; } }
    @media (prefers-reduced-motion: reduce) { .action-state { animation-duration:80ms; transform:none; }.action-state .spinner { animation:none; } }
    @media (forced-colors: active) { .action-state { border-block-start:1px solid CanvasText; }.action-state a { color:LinkText; }.control-notice { color:CanvasText; } }
    .hidden { display:none !important; }

    @media (max-width: 620px) {
      .wrap { padding: 0 12px 32px; }
      header.top { padding: 14px 2px 12px; }
      header.top { flex-wrap:wrap; } header.top h1 { order:1; }.header-actions { order:2; }.secondary-nav { order:3; }
      header.top h1 { font-size: 19px; }
      .panel { border-radius: 18px; }
      .panel-head { padding: 10px 12px 8px; flex-wrap: wrap; row-gap: 8px; }
      .row { padding: 6px 12px; }
      .btn-pill { padding: 0 10px; }
      .cfg-row { padding: 9px 12px; }
      .app-group-head { padding: 8px 12px 0; }
      .app-group-sub .lead-line { padding-left: 18px; }
      /* Too many controls for one phone-width line - let them wrap below. */
      .row-main { flex-wrap: wrap; row-gap: 6px; }
      .row-content { flex: 1 1 auto; }
      .row-actions { flex-wrap: wrap; justify-content: flex-start; margin-left: 0; flex: 1 1 100%; order: 3; }
      .row-detail { padding-left: 16px; }
      .secondary-nav { order:3; flex-basis:100%; justify-content:flex-end; }
      .action-state { margin-inline:12px; flex-wrap:wrap; }.action-state .action-message { flex:1 1 180px; white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
      .action-state a { min-height:44px; }
    }
  </style>
</head>
<body>

  <div id="authGate" class="auth-gate hidden">
    <form class="auth-card" onsubmit="loginDashboard(event)">
      <h2>Veda Control</h2><p>Sign in to queue allowlisted lifecycle workflows.</p>
      <input id="loginUser" class="modal-input" autocomplete="username" placeholder="Username" aria-label="Username" />
      <input id="loginPassword" class="modal-input" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" />
      <div id="loginError" class="login-error hidden" role="alert" aria-live="assertive" aria-atomic="true"></div>
      <button id="loginSubmit" class="btn-modal primary" type="submit">Sign in</button>
    </form>
  </div>

  <!-- Toasts -->
  <div id="toasts"></div>

  <div class="wrap">

    <!-- Header -->
    <header class="top">
      <h1>Dashboard</h1>
      <nav id="secondaryNav" class="secondary-nav hidden" aria-label="Temporal tools">
        <span id="controlNotice" class="control-notice hidden" role="status"></span>
        <a id="temporalUiLink" target="_blank" rel="noopener noreferrer">Temporal UI</a>

      <div class="header-actions">

          <svg width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <path d="M2 3h8M2 6h8M2 9h5"/>
          </svg>
        </button>
        <button id="refreshBtn" class="icon-btn" onclick="refreshAll()" title="Refresh" aria-label="Refresh">
          <svg id="refreshIcon" width="15" height="15" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.5 6A4.5 4.5 0 1 1 8 2.1"/>
            <polyline points="8,1 8,3 10,3"/>
          </svg>
        </button>
        <button class="icon-btn danger" onclick="restartMachine()" title="Restart machine" aria-label="Restart machine">
          <svg width="15" height="15" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 1v3M4 2.3A4.5 4.5 0 1 0 8 2.3"/>

    <!-- Tailscale -->
    <section class="panel">

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1.6"/><path d="M8.5 15.5a5 5 0 0 1 7 0"/><path d="M5.5 12.5a9 9 0 0 1 13 0"/><path d="M3 9.5a13 13 0 0 1 18 0"/></svg>
          </span>
          <h2>Tailscale</h2>

      <div class="rows" id="tailscaleBody"></div>

    <!-- Veda Apps -->
    <section class="panel">

          <span class="section-icon" style="background:rgba(106,92,230,0.22); color:var(--sys-indigo);">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/></svg>
          </span>

        <div class="seg">
          <button id="vedaTabStatus" class="active" onclick="setVedaTab('status')">Status</button>
          <button id="vedaTabConfig" onclick="setVedaTab('config')">Config</button>

    <!-- Docker -->
    <section class="panel">
      <div class="panel-head">

          <span class="section-icon" style="background:rgba(10,132,255,0.22); color:var(--sys-blue);">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8.5" width="16" height="10" rx="2"/><path d="M8 8.5V6.8a1.3 1.3 0 0 1 1.3-1.3h5.4A1.3 1.3 0 0 1 16 6.8v1.7"/><path d="M8.5 12.5h.01M12 12.5h.01M15.5 12.5h.01"/></svg>
          </span>

    <!-- Docker Settings Modal -->
    <div id="dockerModal" class="hidden" onclick="closeDockerSettings()">
      <div class="modal-card" onclick="event.stopPropagation()">
        <h3>Docker Filter</h3>
        <p>Show only containers matching keywords (partial match). Leave empty to show all.</p>
        <div id="filterTags" class="chip-wrap"></div>
        <div class="modal-row-input">
          <input id="filterInput" class="modal-input" type="text" placeholder="Container name, then Enter"
            onkeydown="if(event.key==='Enter') addFilterTag()" />

    <!-- VMware -->
    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">
          <span class="section-icon" style="background:rgba(152,152,159,0.22); color:var(--sys-gray);">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="11" rx="2"/><path d="M8 19.5h8M12 15.5v4"/></svg>
          </span>
          <h2>VMware VMs</h2>
        </div>
      </div>
      <div class="rows" id="vmwareBody"></div>
    </section>

  </div>

  <script>
    let csrfToken = "";
    const intentKeys = new Map();
    const actionByResource = new Map();
    function hasCapability(item, operation) { return (item.capabilities || []).some(c => c.operation === operation && c.allowed); }
    function controlHint(item) { return item.ownershipConflict || item.capabilityReason || item.observationError || item.unsupportedReason || (item.classification && item.classification !== "managed" ? `${item.classification}: lifecycle actions disabled` : item.controlStatus === "Unavailable" ? "Adapter dependency unavailable" : ""); }
    function mutationHeaders(body, intent) {
      const compact = intent.replace(/[^A-Za-z0-9_-]/g, "_").slice(0, 48);
      const key = intentKeys.get(intent) || `intent_${compact}_${crypto.randomUUID().replaceAll("-", "")}`;
      intentKeys.set(intent, key);
      const headers = { "X-CSRF-Token": csrfToken, "Idempotency-Key": key };
      if (body) headers["Content-Type"] = "application/json";
      return headers;
    }
    function setCurrentAction(action) {
      if (!action || !action.resourceId) return;
      actionByResource.set(action.resourceId, action);
      document.querySelectorAll("[data-resource-id]").forEach(updateActionRow);
    }
    function updateActionRow(row) {
      const action = actionByResource.get(row.dataset.resourceId);
      let line = row.querySelector(".action-state");
      if (!action) { line?.remove(); return; }
      const signature = `${action.operation}|${action.state}|${action.message}|${action.temporalUrl || ""}`;
      if (line?.dataset.signature === signature) return;
      if (!line) {
        line = document.createElement("div");
        const summary = document.createElement("span"); summary.className = "action-summary"; summary.setAttribute("role", "status"); summary.setAttribute("aria-live", "polite"); summary.setAttribute("aria-atomic", "true");
        summary.append(el("strong", "action-label"), el("span", "action-message"));
        const link = document.createElement("a"); link.target = "_blank"; link.rel = "noopener noreferrer"; link.textContent = "View in Temporal ↗";
        line.append(summary, link); row.appendChild(line);
      }
      line.className = `action-state ${String(action.state).toLowerCase()}`;
      line.dataset.signature = signature;
      line.querySelector(".action-label").textContent = `${action.operation} · ${action.state}`;
      line.querySelector(".action-message").textContent = action.message || "";
      const link = line.querySelector("a"); link.classList.toggle("hidden", !action.temporalUrl);
      if (action.temporalUrl) { link.href = action.temporalUrl; link.setAttribute("aria-label", `View ${action.operation} for ${row.dataset.resourceName || row.dataset.resourceId} in Temporal (opens in new tab)`); }
      const busy = action.state === "Pending" || action.state === "Running";
      row.setAttribute("aria-busy", busy ? "true" : "false");
      row.querySelectorAll(".row-actions button").forEach(button => { if (button.dataset.locked !== "1") button.disabled = busy; });
    }
    function controlledRow(cells, buttons, key, item) {
      const result = row(cells, buttons, key);
      if (item?.resourceId) { result.dataset.resourceId = item.resourceId; result.dataset.resourceName = item.name || item.resourceId; updateActionRow(result); }
      return result;
    }
    async function loadNavigation() {
      try {
        const res = await fetch("/api/navigation"); if (!res.ok) return;
        const data = await res.json(), nav = document.getElementById("secondaryNav");
        temporalUiLink.href = data.temporalUiUrl; temporalAdminLink.href = data.adminUrl;
        temporalAdminLink.classList.toggle("hidden", !data.showAdmin); nav.classList.remove("hidden");
      } catch (_) {}
    }
    async function loginDashboard(event) {
      event.preventDefault();
      const submit = document.getElementById("loginSubmit");
      const error = document.getElementById("loginError");
      error.textContent = ""; error.classList.add("hidden"); submit.disabled = true;
      try {
        const res = await fetch("/api/login", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ username:loginUser.value, password:loginPassword.value }) });
        let data = {}; try { data = await res.json(); } catch (_) {}
        if (!res.ok) {
          error.textContent = data.error || (res.status === 429 ? "Too many attempts. Wait before trying again." : "Sign in failed. Check your credentials and try again.");
          error.classList.remove("hidden"); return;
        }
        error.textContent = ""; error.classList.add("hidden");
        csrfToken = data.csrfToken; document.getElementById("authGate").classList.add("hidden"); loadNavigation(); refreshAll(); loadActions();
      } catch (_) {
        error.textContent = "Unable to reach the dashboard. Check the connection and try again.";
        error.classList.remove("hidden");
      } finally { submit.disabled = false; }
    }
    async function ensureSession() {
      const data = await fetch("/api/session").then(r => r.json()).catch(() => ({}));
      if (data.authenticated) { csrfToken = data.csrfToken || ""; loadNavigation(); }
      else document.getElementById("authGate").classList.remove("hidden");
    }
    // ---------- helpers ----------
    function el(tag, cls, html) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (html !== undefined) e.innerHTML = html;
      return e;
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    // Status dot + trailing pill badge
    function statusDot(isRunning) {
      const d = document.createElement("span");
      d.className = "status-dot" + (isRunning ? " is-on" : "");
      return d;
    }

    function statusPill(isRunning) {
      const p = document.createElement("span");
      p.className = "pill-badge " + (isRunning ? "on" : "off");
      p.textContent = isRunning ? "Running" : "Stopped";
      return p;
    }

    // Toast — glass HUD, top-center
    function toast(message, ok = true) {
      const wrap = document.getElementById("toasts");
      const t = document.createElement("div");
      t.className = "toast " + (ok ? "ok" : "err");
      t.textContent = message;
      wrap.appendChild(t);
      setTimeout(() => {
        t.style.transition = "opacity 300ms ease, transform 300ms ease";
        t.style.opacity = "0";
        t.style.transform = "translateY(-6px) scale(0.97)";
      }, 3200);
      setTimeout(() => t.remove(), 3550);
    }

    // Pill button
    function btn(label, kind, onClick) {
      const b = document.createElement("button");
      const toneMap = { start: "tone-start", stop: "tone-stop", restart: "tone-restart", shell: "tone-shell" };
      b.className = "btn-pill " + (toneMap[kind] || "tone-shell");
      b.textContent = label;
      b.dataset.label = label;
      b.onclick = () => onClick(b);
      return b;
    }

    function btnGroup(label, buttons) {
      const group = document.createElement("div");
      group.className = "codex-control";
      group.setAttribute("role", "group");
      group.setAttribute("aria-label", label);
      buttons.forEach(button => group.appendChild(button));
      return group;
    }

    // action() — pendingLabel keeps button in "Restarting…" state during postDelay
    async function action(b, url, body, postDelay = 600, silentRefresh = false, pendingLabel = null) {
      const verb = (url.split("/").pop() || "action").replace("mode", "switch mode");
      if (["stop", "restart", "mode"].some(x => url.endsWith("/" + x)) && !confirm(`Queue ${verb} through Temporal?`)) return;
      const resourceRow = b.closest("[data-resource-id]");
      const resourceId = resourceRow?.dataset.resourceId;
      const current = resourceId ? actionByResource.get(resourceId) : null;
      const intent = `${url}:${JSON.stringify(body || {})}`;
      if (current && ["Done", "Failed"].includes(current.state)) intentKeys.delete(intent);
      if (resourceId) setCurrentAction({ resourceId, operation:verb, state:"Pending", message:"Submitting to Temporal…", temporalUrl:null });
      const all = b.parentElement.querySelectorAll("button");
      all.forEach((x) => { x.disabled = true; });
      const original = b.innerHTML;
      b.innerHTML = '<svg class="spinner" width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="14 8" stroke-linecap="round"/></svg>';
      try {
        const opts = { method: "POST", headers: mutationHeaders(body, intent) };
        if (body) {
          opts.body = JSON.stringify(body);
        }
        const res = await fetch(url, opts);
        let data = {};
        try { data = await res.json(); } catch (_) {}
        const ok = res.ok && data.ok !== false;
        if (res.status === 401) document.getElementById("authGate").classList.remove("hidden");
        if (ok && res.status === 202) {
          if (data.currentAction) setCurrentAction(data.currentAction);
          if (data.duplicate) toast("Already queued — showing the same workflow", true);
          loadActions();
        } else {
          if (data.currentAction) setCurrentAction(data.currentAction);
          else if (resourceId) setCurrentAction({ resourceId, operation:verb, state:"Failed", message:data.error || data.message || "Request rejected", temporalUrl:null, updatedAt:new Date().toISOString() });
          toast(data.message || data.error || (ok ? "Done" : "Failed"), ok);
        }
      } catch (e) {
        if (resourceId) setCurrentAction({ resourceId, operation:verb, state:"Pending", message:"Response lost · reconciling with Temporal…", temporalUrl:null });
        toast(e.message || "Request failed; checking Temporal", false); loadActions();
      } finally {
        b.innerHTML = original;
        if (!resourceId) all.forEach((x) => { x.disabled = false; });
        if (resourceRow) updateActionRow(resourceRow);
        setTimeout(() => refreshAll(silentRefresh), postDelay);
      }
    }

    async function auxiliaryAction(b, url) {
      const scope = b.closest(".codex-control");
      const buttons = scope ? [...scope.querySelectorAll("button")] : [b];
      const disabled = buttons.map(button => button.disabled);
      buttons.forEach(button => { button.disabled = true; });
      const original = b.innerHTML;
      b.innerHTML = '<svg class="spinner" width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="14 8" stroke-linecap="round"/></svg>';
      try {
        const intent = `${url}:interactive`;
        const res = await fetch(url, { method:"POST", headers:mutationHeaders(undefined, intent) });
        let data = {};
        try { data = await res.json(); } catch (_) {}
        const ok = res.ok && data.ok !== false;
        if (res.status === 401) document.getElementById("authGate").classList.remove("hidden");
        toast(data.message || data.error || (ok ? "Opened" : "Action failed"), ok);
      } catch (error) {
        toast(error.message || "Interactive tool action failed", false);
      } finally {
        b.innerHTML = original;
        buttons.forEach((button, index) => { button.disabled = disabled[index]; });
        setTimeout(() => refreshAll(true), 600);
      }
    }

    // ---------- detail disclosure ----------
    // Rows render one compact line; cells[1..] are detail and stay collapsed
    // until this row is expanded or the header toggle reveals every row.
    const CHEVRON = '<svg width="9" height="9" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4.5,2 8.5,6 4.5,10"/></svg>';

    // Keyed so a 10s auto-refresh doesn't collapse rows the user opened.
    const _expanded = new Set();

    function toggleDetails(force) {
      const on = force === undefined ? !document.body.classList.contains("details-on") : force;
      document.body.classList.toggle("details-on", on);
      const b = document.getElementById("detailsBtn");
      b.classList.toggle("is-active", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
      b.title = on ? "Hide details" : "Show details";
      try { localStorage.setItem("veda.details", on ? "1" : "0"); } catch (_) {}
    }

    // Row factory — cells[0] is the always-visible line, the rest is detail.
    function row(cells, actionBtns, key) {
      const r = document.createElement("div");
      r.className = "row";
      if (key) r.dataset.key = key;

      const main = document.createElement("div");
      main.className = "row-main";
      const content = document.createElement("div");
      content.className = "row-content";
      content.appendChild(cells[0]);
      main.appendChild(content);

      // leadLine() builds the pill next to the name; lift it out so it sits in
      // its own column right after the fixed-width name box, where every row's
      // pill shares one left edge.
      const pill = content.querySelector(".pill-badge");
      if (pill) main.appendChild(pill);

      if (actionBtns.length) {
        const actions = document.createElement("div");
        actions.className = "row-actions";
        actionBtns.forEach(b => actions.appendChild(b));
        main.appendChild(actions);
      }

      const details = cells.slice(1);
      if (!details.length) {
        main.appendChild(el("span", "disclosure-spacer"));
        r.appendChild(main);
        return r;
      }

      const tog = document.createElement("button");
      tog.className = "disclosure";
      tog.innerHTML = CHEVRON;
      tog.setAttribute("aria-label", "Toggle details");
      main.appendChild(tog);

      const det = document.createElement("div");
      det.className = "row-detail";
      details.forEach(c => det.appendChild(c));

      r.appendChild(main);
      r.appendChild(det);

      const open = !!key && _expanded.has(key);
      r.classList.toggle("expanded", open);
      tog.setAttribute("aria-expanded", open ? "true" : "false");
      tog.onclick = () => {
        const now = r.classList.toggle("expanded");
        tog.setAttribute("aria-expanded", now ? "true" : "false");
        if (key) { if (now) _expanded.add(key); else _expanded.delete(key); }
      };
      return r;
    }

    // ---------- cell builders ----------
    const LINK_ICON = '<svg width="9" height="9" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2H2.5v7.5H10V7.5"/><path d="M7 2h3v3"/><path d="M10 2L5.5 6.5"/></svg>';

    // url makes the name a link straight to the app's public address.
    function leadLine(name, isRunning, monitorable = true, url = null) {
      const line1 = document.createElement("div");
      line1.className = "lead-line";
      if (monitorable) line1.appendChild(statusDot(isRunning));
      const n = document.createElement(url ? "a" : "span");
      n.className = "name-text";
      if (url) {
        n.href = url;
        n.target = "_blank";
        n.rel = "noopener noreferrer";
        n.title = url;
        n.appendChild(document.createTextNode(name));
        n.insertAdjacentHTML("beforeend", LINK_ICON);
      } else {
        n.textContent = name;
        n.title = name;
      }
      line1.appendChild(n);
      if (monitorable) line1.appendChild(statusPill(isRunning));
      return line1;
    }

    function descLine(text) {
      const d = document.createElement("div");
      d.textContent = text;
      d.className = "desc-line";
      d.title = text;
      return d;
    }

    function monoLine(text, accent) {
      const m = document.createElement("div");
      m.textContent = text;
      m.className = "mono-line" + (accent ? " accent" : "");
      m.title = text;
      return m;
    }

    function healthLine(health) {
      const h = document.createElement("div");
      const labels = { online: "Online", offline: "Offline", waiting: "Waiting for VM" };
      const state = health?.state || "offline";
      h.textContent = `Public health: ${labels[state] || "Unknown"}${health?.status ? ` · HTTP ${health.status}` : ""}`;
      h.className = "mono-line health-line " + state;
      h.title = health?.url || h.textContent;
      return h;
    }

    function fmtImageDate(s) {
      if (!s) return "";
      const d = new Date(s.replace(" UTC", "").replace(" +0000", "Z").replace(" ", "T"));
      if (isNaN(d.getTime())) return s.split(" ")[0];
      return "img  " + d.toLocaleDateString("en-GB", { year:"numeric", month:"short", day:"numeric" });
    }

    function emptyRow(text) {
      const e = document.createElement("div");
      e.textContent = text;
      e.className = "empty-row";
      return e;
    }

    // ---------- Veda tab state ----------
    let _vedaTab = "status";
    let _vedaApps = [];

    function setVedaTab(tab) {
      _vedaTab = tab;
      document.getElementById("vedaTabStatus").classList.toggle("active", tab === "status");
      document.getElementById("vedaTabConfig").classList.toggle("active", tab === "config");
      if (tab === "config") renderVedaConfig(_vedaApps);
      else renderVeda(_vedaApps);
    }

    function configField(label, value, accent) {
      const r = document.createElement("div");
      r.className = "cfg-field";
      const lEl = document.createElement("span");
      lEl.textContent = label;
      lEl.className = "k";
      const vEl = document.createElement("span");
      vEl.textContent = value;
      vEl.className = "v" + (accent ? " accent" : "");
      r.appendChild(lEl);
      r.appendChild(vEl);
      return r;
    }

    function renderVedaConfig(apps) {
      const body = document.getElementById("vedaBody");
      body.innerHTML = "";
      if (!apps.length) { body.appendChild(emptyRow("No apps in registry.")); return; }
      apps.forEach((a) => {
        const wrap = document.createElement("div");
        wrap.className = "cfg-row";
        const nameEl = document.createElement("div");
        nameEl.textContent = a.name;
        nameEl.className = "cfg-name";
        wrap.appendChild(nameEl);
        if (a.localPath) wrap.appendChild(configField("path", a.localPath, true));
        if (a.runCmd)    wrap.appendChild(configField("cmd",  a.runCmd,    false));
        if (a.healthCheck && a.healthCheck.type) {
          const hcVal = a.healthCheck.target
            ? `${a.healthCheck.type}  ${a.healthCheck.target}`
            : a.healthCheck.type;
          wrap.appendChild(configField("health", hcVal, false));
        }
        if (a.repo) wrap.appendChild(configField("repo", a.repo, false));
        body.appendChild(wrap);
      });
    }

    // ---------- renderers ----------
    // Build one app's row. displayName overrides what's shown (e.g. "Frontend"/
    // "Backend" inside a group) while API calls still use the real a.name.
    function buildAppRow(a, displayName) {
      const running = a.status === "running";
      const controlRunning = a.resourceId ? String(a.controlStatus).toLowerCase() === "running" : running;
      const mon = a.monitorable !== false;
      const n = a.claudeSessions || 0;
      const codexSessions = a.codexSessions || 0;
      const enc = encodeURIComponent(a.name);
      const cells = [leadLine(displayName || a.name, running, mon, a.url)];
      if (a.url) cells.push(monoLine(a.url, true));
      if (a.description) cells.push(descLine(a.description));
      if (controlHint(a)) cells.push(descLine(controlHint(a)));
      const devCmd = a.devCmd || a.runCmd;
      if (a.mode === "docker" && a.containerName) cells.push(monoLine(`docker  ${a.containerName}`));
      else if (devCmd) cells.push(monoLine(devCmd));
      if (a.supportsModes && a.containerStatus) cells.push(monoLine(`container  ${a.containerName}  ·  ${a.containerStatus}`));
      if (n > 0) cells.push(monoLine(`claude  ×${n}`, false));
      if (codexSessions > 0) cells.push(monoLine(`codex  ×${codexSessions}`, false));
      const btns = [];
      if (hasCapability(a, "switch-mode")) btns.push(modeSeg(a));
      if (a.resourceId) {
        if (controlRunning && hasCapability(a, "stop")) btns.push(btn("Stop", "stop", (b) => action(b, `/api/apps/${enc}/stop`)));
        if (!controlRunning && hasCapability(a, "start")) btns.push(btn("Start", "start", (b) => action(b, `/api/apps/${enc}/start`)));
        if (controlRunning && hasCapability(a, "restart")) btns.push(btn("Restart", "restart", (b) => action(b, `/api/apps/${enc}/restart`, undefined, 5000, true, "Queued…")));
      }
      if (a.localPath) {
        const openClaude = btn("Claude", "shell", (b) => auxiliaryAction(b, `/api/apps/${enc}/shell`));
        openClaude.title = `Open Claude remote control for ${a.name}`;
        if (n > 0) {
          const endClaude = btn(`End ×${n}`, "stop", (b) => auxiliaryAction(b, `/api/apps/${enc}/claude-sessions/kill-all`));
          btns.push(btnGroup("Claude controls", [openClaude, endClaude]));
        } else {
          btns.push(openClaude);
        }
        const openCodex = btn("Codex", "shell", (b) => auxiliaryAction(b, `/api/apps/${enc}/codex`));
        openCodex.title = `Open Codex for ${a.name}`;
        if (codexSessions > 0) {
          const endCodex = btn(`End ×${codexSessions}`, "stop", (b) => auxiliaryAction(b, `/api/apps/${enc}/codex-sessions/kill-all`));
          btns.push(btnGroup("Codex controls", [openCodex, endCodex]));
        } else {
          btns.push(openCodex);
        }
      }
      return controlledRow(cells, btns, "app:" + a.name, a);
    }

    // Dev server vs container — one tap stops the losing side and starts the
    // other, so the two never contend for the app's port.
    function modeSeg(a) {
      const wrap = document.createElement("div");
      wrap.className = "mode-seg";
      wrap.setAttribute("role", "group");
      wrap.setAttribute("aria-label", a.name + " run mode");
      const enc = encodeURIComponent(a.name);
      [["dev", "Dev"], ["docker", "Docker"]].forEach(([mode, label]) => {
        const b = document.createElement("button");
        b.textContent = label;
        b.className = (a.mode === mode ? "active " : "") + mode;
        b.setAttribute("aria-pressed", a.mode === mode ? "true" : "false");
        b.title = mode === "docker"
          ? `Run in Docker (${a.containerName})`
          : `Run as dev server (${a.runCmd || ""})`;
        if (a.mode === mode) b.disabled = true;
        else b.onclick = () => switchMode(b, enc, mode);
        wrap.appendChild(b);
      });
      return wrap;
    }

    async function switchMode(button, enc, mode) {
      return action(button, `/api/apps/${enc}/mode`, { mode }, 1800, true);
    }

    // Group apps whose name follows the "<base>" / "<base>-frontend" /
    // "<base>-backend" convention into one card with independent sub-rows,
    // each keeping its own start/stop/restart.
    function groupVedaApps(apps) {
      const groups = new Map();
      apps.forEach((a) => {
        let base = a.name, role = null;
        if (a.name.endsWith("-frontend")) { base = a.name.slice(0, -"-frontend".length); role = "frontend"; }
        else if (a.name.endsWith("-backend")) { base = a.name.slice(0, -"-backend".length); role = "backend"; }
        if (!groups.has(base)) groups.set(base, []);
        groups.get(base).push({ app: a, role });
      });
      const ordered = [];
      groups.forEach((members, base) => {
        if (members.length > 1) {
          const hasFrontend = members.some((m) => m.role === "frontend");
          const hasBackend = members.some((m) => m.role === "backend");
          members.forEach((m) => {
            if (!m.role) m.role = hasBackend && !hasFrontend ? "frontend" : "backend";
          });
          members.sort((x, y) => (x.role === "frontend" ? 0 : 1) - (y.role === "frontend" ? 0 : 1));
        }
        ordered.push({ base, members });
      });
      return ordered;
    }

    function renderVeda(apps) {
      const body = document.getElementById("vedaBody");
      body.innerHTML = "";
      if (!apps.length) { body.appendChild(emptyRow("No apps in registry.")); return; }
      groupVedaApps(apps).forEach(({ base, members }) => {
        if (members.length === 1) {
          body.appendChild(buildAppRow(members[0].app));
          return;
        }
        const group = document.createElement("div");
        group.className = "app-group";
        const head = document.createElement("div");
        head.className = "app-group-head";
        head.textContent = base;
        group.appendChild(head);
        members.forEach(({ app, role }) => {
          const sub = buildAppRow(app, role === "frontend" ? "Frontend" : "Backend");
          sub.classList.add("app-group-sub");
          group.appendChild(sub);
        });
        body.appendChild(group);
      });
    }

    function renderDocker(d) {
      const body = document.getElementById("dockerBody");
      const badge2 = document.getElementById("dockerFilterBadge");
      body.innerHTML = "";
      if (!d || d.available === false) {
        badge2.style.display = "none";
        body.appendChild(emptyRow("Docker is not installed or not running."));
        return;
      }
      const list = d.containers || [];
      const filtered = d.filtered && (d.filterList || []).length > 0;
      if (filtered) {
        badge2.textContent = `filtered ×${d.filterList.length}`;
        badge2.title = d.filterList.join(", ");
        badge2.style.display = "";
      } else {
        badge2.style.display = "none";
      }
      if (d.error) {
        const fixBtn = btn("Fix Docker", "shell", (b) => action(b, "/api/docker/fix"));
        body.appendChild(row([descLine("Error: " + d.error)], [fixBtn], "docker:error"));
        return;
      }
      if (!list.length) {
        body.appendChild(emptyRow(filtered ? "No containers match the filter." : "No containers."));
        return;
      }
      list.forEach((c) => {
        const running = c.status === "running";
        const cells = [leadLine(c.name, running, true, c.url)];
        if (c.url) cells.push(monoLine(c.url, true));
        if (c.image) cells.push(descLine(c.image));
        if (c.ports) {
          cells.push(monoLine(c.ports, true));
        } else if (c.statusText) {
          cells.push(monoLine(c.statusText));
        }
        if (c.imageCreated) cells.push(monoLine(fmtImageDate(c.imageCreated)));
        if (controlHint(c)) cells.push(descLine(controlHint(c)));
        const enc = encodeURIComponent(c.name);
        const btns = [];
        if (running && hasCapability(c, "stop")) btns.push(btn("Stop", "stop", (b) => action(b, `/api/docker/${enc}/stop`)));
        if (!running && hasCapability(c, "start")) btns.push(btn("Start", "start", (b) => action(b, `/api/docker/${enc}/start`)));
        if (running && hasCapability(c, "restart")) {
          btns.push(btn("Restart", "restart", (b) => action(b, `/api/docker/${enc}/restart`, undefined, 3000, true, "Restarting…")));
        }
        body.appendChild(controlledRow(cells, btns, "ctr:" + c.name, c));
      });
    }

    // ---------- Docker settings modal ----------
    let _filterTags = [];

    function openDockerSettings() {
      fetch("/api/settings").then(r => r.json()).then(s => {
        _filterTags = [...(s.docker?.filter || [])];
        renderTags();
        document.getElementById("filterInput").value = "";
        document.getElementById("dockerModal").classList.remove("hidden");
        document.getElementById("filterInput").focus();
      });
    }

    function closeDockerSettings() {
      document.getElementById("dockerModal").classList.add("hidden");
    }

    function renderTags() {
      const wrap = document.getElementById("filterTags");
      wrap.innerHTML = "";
      _filterTags.forEach((tag, i) => {
        const t = document.createElement("span");
        t.className = "chip";
        const label = document.createElement("span");
        label.textContent = tag;
        const rm = document.createElement("button");
        rm.className = "chip-x";
        rm.textContent = "✕";
        rm.setAttribute("aria-label", "Remove " + tag);
        rm.onclick = () => removeTag(i);
        t.appendChild(label);
        t.appendChild(rm);
        wrap.appendChild(t);
      });
      if (!_filterTags.length) {
        const empty = document.createElement("span");
        empty.textContent = "Showing all containers";
        empty.className = "chip-empty";
        wrap.appendChild(empty);
      }
    }

    function addFilterTag() {
      const input = document.getElementById("filterInput");
      const val = input.value.trim();
      if (val && !_filterTags.includes(val)) {
        _filterTags.push(val);
        renderTags();
      }
      input.value = "";
      input.focus();
    }

    function removeTag(i) {
      _filterTags.splice(i, 1);
      renderTags();
    }

    async function saveDockerFilter() {
      try {
        const res = await fetch("/api/settings/docker/filter", {
          method: "PATCH",
          headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfToken },
          body: JSON.stringify({ filter: _filterTags }),
        });
        const data = await res.json();
        if (data.ok) {
          toast("Filter saved", true);
          closeDockerSettings();
          refreshAll();
        } else {
          toast(data.error || "Save failed", false);
        }
      } catch (e) {
        toast(e.message || "Request failed", false);
      }
    }

    function renderVmware(v) {
      const body = document.getElementById("vmwareBody");
      body.innerHTML = "";
      if (!v || v.available === false) {
        body.appendChild(emptyRow("VMware (vmrun.exe) not found."));
        return;
      }
      const list = v.vms || [];
      if (v.error) { body.appendChild(emptyRow("Error: " + v.error)); return; }
      if (!list.length) { body.appendChild(emptyRow("No running VMs.")); return; }
      list.forEach((vm) => {
        const running = vm.status === "running";
        // The VM's health URL is an endpoint, not a page — link its origin.
        let vmUrl = null;
        try { vmUrl = vm.health?.url ? new URL(vm.health.url).origin + "/" : null; } catch (_) {}
        const cells = [leadLine(vm.name, running, true, vmUrl)];
        if (vm.vmx) cells.push(monoLine(vm.vmx.split(/[\\/]/).pop()));
        if (!running && vm.desiredRunning) cells.push(descLine("Auto-recovery enabled"));
        if (vm.health) cells.push(healthLine(vm.health));
        if (controlHint(vm)) cells.push(descLine(controlHint(vm)));
        const buttons = [];
        if (running && hasCapability(vm, "stop")) buttons.push(btn("Stop", "stop", (b) => action(b, "/api/vmware/stop", { vmx: vm.vmx })));
        if (!running && hasCapability(vm, "start")) buttons.push(btn("Start", "start", (b) => action(b, "/api/vmware/start", { vmx: vm.vmx })));
        if (hasCapability(vm, "restart")) buttons.push(btn("Restart", "restart", (b) => action(b, "/api/vmware/restart", { vmx: vm.vmx })));
        body.appendChild(controlledRow(cells, buttons, "vm:" + vm.name, vm));
      });
    }

    // ---------- restart machine ----------
    async function restartMachine() {
      toast("Machine restart is disabled until a dedicated adapter exists", false);
    }

    async function loadActions() {
      const notice = document.getElementById("controlNotice");
      try {
        const [actionRes, readyRes] = await Promise.all([fetch("/api/actions"), fetch("/api/control/readiness")]);
        if (actionRes.status === 401) { document.getElementById("authGate").classList.remove("hidden"); return; }
        const data = await actionRes.json(), ready = await readyRes.json();
        (data.actions || []).forEach(setCurrentAction);
        const healthy = ready.ok === true;
        notice.textContent = healthy ? "" : (ready.error || `Controls unavailable · ${ready.status || "Temporal offline"}`);
        notice.classList.toggle("hidden", healthy);
      } catch (_) { notice.textContent = "Controls unavailable · Temporal offline"; notice.classList.remove("hidden"); }
    }

    // ---------- refresh — parallel per-section fetches ----------
    let _loadingVeda = false, _loadingDocker = false, _loadingVmware = false;

    function refreshAll(silent = false) {
      const rb = document.getElementById("refreshBtn");
      const icon = document.getElementById("refreshIcon");
      if (!_loadingVeda && !_loadingDocker && !_loadingVmware) {
        rb.disabled = true;
        icon.style.animation = "spin 0.7s linear infinite";
      }

      const tryDone = () => {
        if (!_loadingVeda && !_loadingDocker && !_loadingVmware) {
          icon.style.animation = "";
          rb.disabled = false;
        }
      };

      if (!_loadingVeda) {
        _loadingVeda = true;
        fetch("/api/apps")
          .then(r => r.json())
          .then(data => {
            _vedaApps = data || [];
            if (_vedaTab === "config") renderVedaConfig(_vedaApps);
            else renderVeda(_vedaApps);
          })
          .catch(e => { if (!silent) toast("Veda: " + (e.message || e), false); })
          .finally(() => { _loadingVeda = false; tryDone(); });
      }

      if (!_loadingDocker) {
        _loadingDocker = true;
        fetch("/api/docker")
          .then(r => r.json())
          .then(data => renderDocker(data))
          .catch(e => { if (!silent) toast("Docker: " + (e.message || e), false); })
          .finally(() => { _loadingDocker = false; tryDone(); });
      }

      if (!_loadingVmware) {
        _loadingVmware = true;
        fetch("/api/vmware")
          .then(r => r.json())
          .then(data => renderVmware(data))
          .catch(e => { if (!silent) toast("VMware: " + (e.message || e), false); })
          .finally(() => { _loadingVmware = false; tryDone(); });
      }
    }

    // ---------- Tailscale ----------
    function renderTailscale(s) {
      const body = document.getElementById("tailscaleBody");
      body.innerHTML = "";
      const connected = !!(s && s.connected);
      const cells = [leadLine("Tailscale", connected)];
      if (connected && s.ip) cells.push(monoLine(s.ip, true));
      const toggleBtn = btn(connected ? "Disconnect" : "Connect", connected ? "stop" : "start", (b) => toggleTailscale(b));
      toggleBtn.dataset.connected = connected ? "1" : "0";
      toggleBtn.disabled = true;
      toggleBtn.title = "Disabled until a dedicated allowlisted adapter exists";
      body.appendChild(row(cells, [toggleBtn], "tailscale"));
    }

    async function loadTailscale() {
      try {
        const res = await fetch("/api/tailscale/status");
        renderTailscale(await res.json());
      } catch (e) {
        renderTailscale({ connected: false, ip: null });
      }
    }

    async function toggleTailscale(b) {
      b.disabled = true; toast("Tailscale mutation is disabled until a dedicated adapter exists", false);
    }

    // Escape closes Docker modal
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeDockerSettings();
    });

    // ---------- skeletons ----------
    function skBar(w, h, delay = 0) {
      const b = document.createElement("div");
      b.className = "sk";
      b.style.cssText = `width:${w}px; height:${h}px; animation-delay:${delay}ms;`;
      return b;
    }

    function skRow(width, btnCount = 1, rowDelay = 0) {
      const r = document.createElement("div");
      r.className = "row";
      const main = document.createElement("div");
      main.className = "row-main";
      const content = document.createElement("div");
      content.className = "row-content";
      content.appendChild(skBar(width, 13, rowDelay));
      main.appendChild(content);
      if (btnCount) {
        const actions = document.createElement("div");
        actions.className = "row-actions";
        for (let i = 0; i < btnCount; i++) actions.appendChild(skBar(58, 25, rowDelay + i * 80));
        main.appendChild(actions);
      }
      r.appendChild(main);
      return r;
    }

    function initSkeletons() {
      const sk = (id, widths, btnCount) => {
        const body = document.getElementById(id);
        body.innerHTML = "";
        widths.forEach((w, i) => body.appendChild(skRow(w, btnCount, i * 100)));
      };
      sk("tailscaleBody", [100], 1);
      sk("vedaBody",      [140, 120, 160], 2);
      sk("dockerBody",    [130, 110, 145], 1);
      sk("vmwareBody",    [120, 140], 1);
    }

    try { toggleDetails(localStorage.getItem("veda.details") === "1"); } catch (_) {}
    initSkeletons();
    ensureSession();
    loadTailscale();
    loadActions();
    setInterval(loadTailscale, 15000);
    setInterval(loadActions, 3000);
    refreshAll();
    setInterval(refreshAll, 10000);
  </script>
</body>
</html>
